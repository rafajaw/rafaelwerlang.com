<article class="post">
  <header class="post-hero">
    <p class="post-meta mono"><a href="/">← Index</a><span><time datetime="{{iso}}">{{date}}</time> · {{minutes}} min read</span></p>
    {{draft}}
    <h1 class="post-title split">{{title}}</h1>
    <p class="post-desc"><em>{{description}}</em></p>
    <div class="tags mono">{{tags}}</div>
  </header>
  {{toc}}
  <div class="prose">
{{content}}
  </div>
  <nav class="post-end"><a class="mega-link roll" href="/" data-text="Back to the index">Back to the index</a></nav>
</article>
