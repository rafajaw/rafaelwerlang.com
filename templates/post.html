<article class="post">
  <header class="post-hero">
    <p class="post-meta mono"><a href="/">← Index</a><span><time datetime="{{iso}}">{{date}}</time> · {{minutes}} min read<button type="button" class="speed-btn" data-speed aria-label="Speed read this post"><svg class="speed-ico" viewBox="0 0 12 16" aria-hidden="true"><path d="M6 0v4.5M6 11.5V16" stroke="currentColor" stroke-width="1.4"/><circle cx="6" cy="8" r="1.9" fill="var(--hot)"/></svg>Speed read</button></span></p>
    {{draft}}
    <h1 class="post-title split">{{title}}</h1>
    <p class="post-desc"><em>{{description}}</em></p>
    <div class="tags mono">{{tags}}</div>
  </header>
  {{toc}}
  <div class="prose">
{{content}}
  </div>
  <nav class="post-end"><a class="mega-link roll" href="/" data-text="Back to the index">Back to the index</a></nav>
</article>
