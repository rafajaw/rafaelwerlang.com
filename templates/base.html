<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta property="og:type" content="{{og_type}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b0b0b">
<link rel="alternate" type="application/rss+xml" title="{{site}}" href="/rss.xml">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/InterTight.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/css/site.css">
<script src="/js/site.js" defer></script>
<script src="/js/speed.js" defer></script>
<script data-goatcounter="https://rafaelwerlang.goatcounter.com/count" src="/js/count.js" async></script>
</head>
<body data-kind="{{kind}}">
<a class="skip" href="#app">Skip to content</a>
<header class="top mono">
  <a class="brand" href="/">Rafael Werlang</a>
  <nav class="nav">
    <a href="/">Index</a>
    <a href="/about/">About</a>
    <a href="{{github}}" rel="noopener" target="_blank">GitHub</a>
    <a href="/rss.xml">RSS</a>
  </nav>
</header>
<main id="app" data-kind="{{kind}}">
{{main}}
</main>
<footer class="foot">
  <p class="foot-label mono">Write to me</p>
  <a class="foot-mail roll" href="mailto:{{email}}" data-text="{{email}}">{{email}}</a>
  <div class="foot-row mono"><span>© {{year}} {{site}}</span><span class="clock">Pescara</span><a href="#app" class="totop">Top ↑</a></div>
</footer>
<div class="curtain" aria-hidden="true"></div>
<div class="cursor" aria-hidden="true"></div>
</body>
</html>
